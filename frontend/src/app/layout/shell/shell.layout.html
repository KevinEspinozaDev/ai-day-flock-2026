<mat-sidenav-container class="shell">
  <mat-sidenav
    #sidenav
    class="shell__sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    [attr.role]="isHandset() ? 'dialog' : 'navigation'"
  >
    <div class="shell__brand">
      <mat-icon>shield_lock</mat-icon>
      <span>VulnPrio</span>
    </div>
    <mat-nav-list>
      @for (item of navItems; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive
          #rla="routerLinkActive"
          [activated]="rla.isActive"
          (click)="onNavigate(sidenav)"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell__content">
    <mat-toolbar class="shell__toolbar">
      @if (isHandset()) {
        <button mat-icon-button type="button" aria-label="Abrir menú" (click)="sidenav.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="shell__title">Priorización de vulnerabilidades</span>
      <span class="shell__spacer"></span>

      <button
        type="button"
        class="user-button"
        [matMenuTriggerFor]="userMenu"
        aria-label="Menú de usuario"
      >
        <span class="user-button__name">{{ displayName() }}</span>
        <img class="avatar" src="/assets/default-avatar.svg" alt="" width="36" height="36" />
        <mat-icon>expand_more</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu" xPosition="before">
        <div class="user-menu__header">
          <img class="avatar avatar--large" src="/assets/default-avatar.svg" alt="" width="48" height="48" />
          <div>
            <strong>{{ displayName() }}</strong>
            <span>{{ user()?.username }}</span>
          </div>
        </div>
        <mat-divider />
        <button mat-menu-item type="button" (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Cerrar sesión</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="shell__main">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
